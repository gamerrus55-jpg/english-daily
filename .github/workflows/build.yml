name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Сертификаты НУЦ Минцифры нужны, чтобы телефон доверял серверам GigaChat
      - name: Download Russian Trusted CA certificates
        run: |
          mkdir -p app/src/main/assets
          fetch() {
            out="$1"; shift
            for url in "$@"; do
              if curl -fsSL --max-time 30 -o "$out" "$url" && [ "$(stat -c%s "$out")" -gt 500 ]; then
                echo "OK: $out <- $url"; return 0
              fi
            done
            echo "::warning::Could not download $out"; rm -f "$out"; return 0
          }
          fetch app/src/main/assets/russian_root_ca.crt \
            https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt \
            https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer
          fetch app/src/main/assets/russian_sub_ca.crt \
            https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt \
            https://gu-st.ru/content/Other/doc/russian_trusted_sub_ca.cer
          ls -la app/src/main/assets

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EnglishDaily.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishDaily
          path: EnglishDaily.apk

      # Свежий APK всегда лежит по одной ссылке:
      # https://github.com/<user>/english-daily/releases/latest/download/EnglishDaily.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: EnglishDaily.apk
          make_latest: true
